version: "3.8"

services:
  rabbitmq:
    container_name: mdcc_nuvem_rabbitmq
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    container_name: mdcc_nuvem_minio
    image: "quay.io/minio/minio:RELEASE.2025-03-12T18-04-18Z"
    ports:
      - "9900:9000"
      - "9901:9001"
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123

  createbuckets:
    container_name: mdcc_nuvem_createbuckets
    image: quay.io/minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 minio minio123;
      /usr/bin/mc mb dockerminio/mdcc-nuvem-images-t2-ufc;
      /usr/bin/mc mb dockerminio/mdcc-nuvem-images-t2-ufc-static;
      /usr/bin/mc mb dockerminio/mdcc-nuvem-images-t2-ufc-media;
      /usr/bin/mc anonymous set public dockerminio/mdcc-nuvem-images-t2-ufc-static;
      /usr/bin/mc anonymous set public dockerminio/mdcc-nuvem-images-t2-ufc-media;
      /usr/bin/mc anonymous set public dockerminio/mdcc-nuvem-images-t2-ufc;
      exit 0;
      "

  postgres:
    container_name: mdcc_nuvem_postgres
    image: postgres:14-alpine
    volumes:
      - mdcc_nuvem_db_storage:/var/lib/postgresql/data
      - ./init-database.sh:/docker-entrypoint-initdb.d/init-database.sh
    restart: on-failure
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mdcc_nuvem_db
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    ports:
      - "5433:5432"

  backend_t2:
    container_name: mdcc_nuvem_backend_t2
    build:
      context: ./backend_t2
      dockerfile: Dockerfile
    volumes:
      - ./backend_t2:/app:cached
    command: ["bash", "./entrypoint.dev.sh"]
    restart: on-failure
    env_file:
      - ./backend_t2/.env.docker
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - rabbitmq
      - minio
      - createbuckets

  celery:
    container_name: celery
    platform: linux/amd64
    build:
      context: ./backend_t2
      dockerfile: docker/celery/dev/Dockerfile
    # command: [ "bash", "./docker/celery/dev/entrypoint.dev.sh" ]
    command: python3 -m celery -A celery_settings:app worker -E
    healthcheck:
      test: ["CMD", "venv/bin/python3", "-m", "celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./backend_t2:/usr/src/app/:cached
      - ./backend_t2:/mdcc_nuvem_backend_t2:cached
    env_file: ./backend_t2/.env
    depends_on:
      - postgres
      - rabbitmq
      - backend_t2

  celery_beat:
    container_name: celery_beat
    platform: linux/amd64
    build:
      context: ./backend_t2
      dockerfile: docker/celery_beat/dev/Dockerfile
    command: venv/bin/python3 -m celery -A celery_settings:app beat -l INFO
    env_file: ./backend_t2/.env
    depends_on:
      - celery

  frontend:
    container_name: mdcc_nuvem_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app:cached
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    restart: on-failure
    env_file:
      - ./frontend/.env
    ports:
      - "3001:3000"
    depends_on:
      - backend_t2

volumes:
  mdcc_nuvem_db_storage:
  rabbitmq_data:
  celery_data:
  celery_beat_data:
  minio_data:
  minio_client_data:
